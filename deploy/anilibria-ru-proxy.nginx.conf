# Зеркало API AniLiberty для сервера, стоящего вне России.
# Ставится на ЛЮБОЙ российский VPS (Ubuntu): apt install nginx, положить файл
# в /etc/nginx/conf.d/anilibria-proxy.conf, nginx -t && systemctl reload nginx.
# Закройте доступ по IP основного сервера (allow ...; deny all;), чтобы зеркалом не пользовались чужие.
# На основном сервере в /opt/anigalaxy/.env.production:
#   ANILIBRIA_BASE=http://IP_РОССИЙСКОГО_VPS/api/v1
server {
    listen 80;
    server_name _;

    # allow IP_ОСНОВНОГО_СЕРВЕРА;
    # deny all;

    location /api/v1/ {
        proxy_pass https://anilibria.top/api/v1/;
        proxy_ssl_server_name on;
        proxy_set_header Host anilibria.top;
        proxy_set_header Accept application/json;
        proxy_connect_timeout 8s;
        proxy_read_timeout 12s;
    }
}
