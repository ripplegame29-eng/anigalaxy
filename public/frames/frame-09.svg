<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"><defs><filter id="gl" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="gl2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7"/></filter><filter id="bl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter><linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff6d8"/><stop offset="0.5" stop-color="#ffd27a"/><stop offset="1" stop-color="#c98a1e"/></linearGradient><linearGradient id="steel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef1f8"/><stop offset="0.5" stop-color="#8e98ad"/><stop offset="1" stop-color="#3a4254"/></linearGradient><radialGradient id="bh"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="0.74" stop-color="#000" stop-opacity="0"/><stop offset="0.775" stop-color="#12002a" stop-opacity="1"/><stop offset="0.8" stop-color="#ff7a2a" stop-opacity="1"/><stop offset="0.83" stop-color="#ffe2a8" stop-opacity="1"/><stop offset="0.86" stop-color="#ff5ea8" stop-opacity="0.9"/><stop offset="0.92" stop-color="#6a2cff" stop-opacity="0.35"/><stop offset="1" stop-color="#6a2cff" stop-opacity="0"/></radialGradient><radialGradient id="pl"><stop offset="0" stop-color="#ffe9c4" stop-opacity="1"/><stop offset="1" stop-color="#c0561a" stop-opacity="1"/></radialGradient></defs><style>.spin{animation:s 50s linear infinite;transform-origin:256px 256px}.rev{animation:s 80s linear infinite reverse;transform-origin:256px 256px}
