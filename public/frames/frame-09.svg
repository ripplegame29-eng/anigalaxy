.el{transform-origin:150px 90px;animation:ea 6s infinite}.er{transform-origin:362px 90px;animation:ear 6s infinite}@keyframes ea{0%,84%,100%{transform:rotate(0)}88%{transform:rotate(-6deg)}92%{transform:rotate(2deg)}}@keyframes ear{0%,84%,100%{transform:rotate(0)}88%{transform:rotate(6deg)}92%{transform:rotate(-2deg)}}
.tl{transform-origin:110px 380px;animation:tl 4s ease-in-out infinite}.tr{transform-origin:402px 380px;animation:tr 4s ease-in-out infinite}@keyframes tl{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(5deg)}}@keyframes tr{0%,100%{transform:rotate(3deg)}50%{transform:rotate(-5deg)}}
