<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AniGalaxy — Колесо фортуны</title>
<!-- Копия для встройки в модалку «Ежедневный бонус» (iframe из src/components/FortuneWheel.tsx).
     Отличия от оригинала: у .w снят min-width:640px — иначе в узкой модалке
     колесо уезжает в боковой скролл .wrap; перф-правки без смены вида — scanline
     едут через transform (композитор вместо repaint background-position) и пульс
     рамки кнопки идёт через opacity вместо box-shadow. Картинки и JS не менялись.
     Плюс: у svg.frame отключена бегущая пунктирная анимация (stroke-dasharray) —
     бегущий по периметру светящийся отрезок выглядел в модалке как полоса
     прокрутки; рамка осталась статичной. -->
<style>
:root{--cy:rgb(var(--a1));--bl:#3b6bff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;background:#060914;display:grid;place-items:center;padding:20px 12px;overflow-x:hidden;font-family:system-ui,Segoe UI,Roboto,sans-serif}
.stack{width:100%;max-width:1500px;display:grid;gap:clamp(18px,2.4vw,44px)}.wrap{width:100%;overflow-x:auto}
.w{position:relative;width:100%;min-width:0;aspect-ratio:2140/465;border-radius:2.1%/9.6%;overflow:hidden;background:#050a1c;animation:in .9s both;cursor:default}
@keyframes in{from{opacity:0;transform:translateY(20px) scale(.98)}}
.w>img{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}
.rg{position:absolute;background-repeat:no-repeat;pointer-events:none}
/* общий слой света, следящий за курсором */
.light{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;background:radial-gradient(circle 22vmin at var(--mx,50%) var(--my,50%),rgba(var(--a2),.22),transparent 70%);opacity:0;transition:opacity .4s}
.w:hover .light{opacity:1}
.scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0 1px,transparent 1px 4px);mix-blend-mode:multiply;animation:sc 9s linear infinite}
@keyframes sc{to{background-position:0 80px}}
.sweep{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;background:linear-gradient(100deg,transparent 42%,rgba(var(--a4),.16) 50%,transparent 58%);translate:-130% 0;animation:sw 7s ease-in-out infinite}
@keyframes sw{0%,60%{translate:-130% 0}100%{translate:130% 0}}
svg.frame{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.frame rect,.frame polygon{fill:none;stroke-width:4;stroke-dasharray:110 890;animation:dash 6s linear infinite))}
/* копия: статичная рамка вместо бегущего отрезка — он читался как полоса прокрутки */
.frame rect,.frame polygon{stroke-dasharray:none;animation:none;opacity:.5}
@keyframes dash{to{stroke-dashoffset:-1000}}
/* пульсирующее свечение */
.glow{position:absolute;border-radius:50%;pointer-events:none;mix-blend-mode:screen;animation:pul 3.2s ease-in-out infinite}
@keyframes pul{50%{opacity:.35;transform:scale(1.12)}}
.st{position:absolute;width:1.3%;aspect-ratio:1;pointer-events:none;background:#e9f8ff;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);filter:drop-shadow(0 0 6px rgb(var(--a1)));animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:0;transform:scale(.2) rotate(0)}50%{opacity:1;transform:scale(1) rotate(90deg)}}
.mote{position:absolute;width:.55%;aspect-ratio:1;border-radius:50%;background:#bfeaff;box-shadow:0 0 8px rgb(var(--a1));pointer-events:none;opacity:0;animation:rise var(--t) ease-out infinite;animation-delay:var(--d)}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-9vw);opacity:0}}
/* глитч-слои региона */
.gz{position:absolute;pointer-events:none;overflow:visible}
.gz .rg{inset:0;mix-blend-mode:screen;opacity:0}
.gz .a{filter:hue-rotate(70deg) saturate(1.8) brightness(1.1)}
.gz .b{filter:hue-rotate(-70deg) saturate(1.8) brightness(1.1)}
.gz.on .a{animation:ga .55s steps(1) both}.gz.on .b{animation:gb .55s steps(1) both}
.gz.loop .a{animation:ga .55s steps(1) infinite}.gz.loop .b{animation:gb .55s steps(1) infinite}
@keyframes ga{0%{opacity:.45;clip-path:inset(10% 0 62% 0);transform:translate(-3%)}20%{opacity:.45;clip-path:inset(62% 0 10% 0);transform:translate(3%)}40%{opacity:.45;clip-path:inset(35% 0 40% 0);transform:translate(-2%)}60%{opacity:.45;clip-path:inset(0 0 82% 0);transform:translate(4%)}80%{opacity:.45;clip-path:inset(75% 0 0 0);transform:translate(-3%)}100%{opacity:0}}
@keyframes gb{0%{opacity:.45;clip-path:inset(50% 0 22% 0);transform:translate(3%)}20%{opacity:.45;clip-path:inset(6% 0 72% 0);transform:translate(-3%)}40%{opacity:.45;clip-path:inset(72% 0 6% 0);transform:translate(2%)}60%{opacity:.45;clip-path:inset(30% 0 36% 0);transform:translate(-4%)}80%{opacity:.45;clip-path:inset(15% 0 55% 0);transform:translate(3%)}100%{opacity:0}}
/* кнопка */
.cta{position:absolute;display:block;cursor:pointer;border-radius:1.4vw;-webkit-tap-highlight-color:transparent;outline:none}
.cta .rg{inset:0;pointer-events:none;border-radius:inherit;transition:transform .25s cubic-bezier(.2,1.4,.4,1),filter .25s}
.cta .ring{position:absolute;inset:-2px;border-radius:inherit;box-shadow:0 0 0 2px rgba(var(--a1),0),0 0 0 rgba(var(--a1),0);transition:box-shadow .25s;pointer-events:none}
.cta .ring::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:0 0 0 1px rgba(var(--a1),.5),0 0 1.4vw rgba(var(--a1),.5);opacity:0;pointer-events:none}
.cta .shine{position:absolute;inset:0;overflow:hidden;border-radius:inherit;pointer-events:none}
.cta .shine::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.85) 50%,transparent 62%);translate:-130% 0;animation:sh 3.6s ease-in-out infinite;mix-blend-mode:soft-light}
@keyframes sh{0%,55%{translate:-130% 0}100%{translate:130% 0}}
.cta:hover .rg,.cta:focus-visible .rg{transform:scale(1.045);filter:brightness(1.12)}
.cta:hover .ring,.cta:focus-visible .ring{box-shadow:0 0 0 2px rgb(var(--a1)),0 0 3vw rgba(var(--a1),.8)}
.cta:active .rg{transform:scale(.96)}
/* Пульс — через opacity на статической тени (композитор), а не box-shadow:
   тот гнал repaint кнопки каждый кадр бесконечно. Вид пульса тот же. */
.cta.idle .ring::after{animation:rg 2.4s ease-in-out infinite}
@keyframes rg{50%{opacity:1}}
.rip{position:absolute;border-radius:50%;background:rgba(var(--a3),.45);transform:scale(0);animation:rp .6s ease-out forwards;pointer-events:none}
@keyframes rp{to{transform:scale(4);opacity:0}}
/* зоны наведения для плашек и тега */
.hs{position:absolute;border-radius:1vw;transition:box-shadow .25s,background .25s}
.hs:hover{box-shadow:0 0 0 1.5px rgba(var(--a1),.8),0 0 2vw rgba(var(--a2),.6);background:rgba(var(--a2),.12)}
.tagfx{position:absolute;pointer-events:none;overflow:hidden;border-radius:1vw;rotate:-9deg}
.tagfx::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 40%,rgba(180,230,255,.5) 50%,transparent 60%);translate:-130% 0;animation:sh 5s 1s ease-in-out infinite;mix-blend-mode:screen}
.spark{position:fixed;width:12px;height:12px;pointer-events:none;z-index:99;background:#e9f8ff;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:bu .9s ease-out forwards}
@keyframes bu{to{transform:translate(var(--x),var(--y)) scale(.2) rotate(180deg);opacity:0}}
.modal{position:fixed;inset:0;display:grid;place-items:center;padding:20px;background:rgba(2,5,20,.75);backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .3s;z-index:90}
.modal.on{opacity:1;pointer-events:auto}
.box{max-width:400px;width:100%;padding:30px;border-radius:22px;text-align:center;color:#e4f6ff;border:1.5px solid var(--bl);background:linear-gradient(160deg,#0d1b66,#070d28);box-shadow:0 0 50px rgba(59,107,255,.6);transform:scale(.85) rotate(-2deg);transition:transform .4s cubic-bezier(.2,1.4,.4,1)}
.modal.on .box{transform:none}
.box h3{font-size:22px;margin-bottom:8px}.box p{color:#9db6ee;font-size:14px;line-height:1.5}
.box ul{list-style:none;padding:0;margin:18px 0;display:grid;gap:8px}
.box li{padding:10px;border-radius:10px;background:rgba(59,107,255,.2);border:1px solid rgba(var(--a1),.3);font-weight:600;font-size:14px}
.box button{border:0;cursor:pointer;padding:12px 26px;border-radius:12px;font:700 14px system-ui;color:#0a1450;background:linear-gradient(180deg,#f4fbff,#b9d8ff)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.pt{position:absolute;top:-6%;width:1.3%;aspect-ratio:1.5;border-radius:100% 0 100% 0;background:linear-gradient(135deg,#f0d8ff,#a56bff);opacity:.75;pointer-events:none;animation:fall var(--t) linear infinite;animation-delay:var(--d);filter:drop-shadow(0 0 4px rgba(190,130,255,.8))}
@keyframes fall{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(var(--sx),55vw) rotate(180deg) scaleX(.5)}100%{transform:translate(0,12vw) rotate(360deg)}}
@keyframes fall2{to{translate:var(--sx,0px) var(--hh,700px)}}
.pt{animation:fall2 var(--t) linear infinite,sway 3s ease-in-out infinite alternate;animation-delay:var(--d),var(--d)}
@keyframes sway{from{rotate:-30deg}to{rotate:40deg}}
.bd{position:absolute;pointer-events:none;mix-blend-mode:screen;animation:pul 2.8s ease-in-out infinite}

.d{--a1:93,240,255;--a2:93,170,255;--a3:80,150,255;--a4:150,200,255}
.b{--a1:197,139,255;--a2:170,110,255;--a3:190,120,255;--a4:220,180,255}
.d .frame rect{stroke:url(#fg1)}.b .frame polygon{stroke:url(#fg2)}
.b .cta{border-radius:.9vw}

.d .frame rect{stroke:url(#fg1)}
.disc{border-radius:50%;backface-visibility:hidden}
.wedge{display:none!important;position:absolute;inset:0;mix-blend-mode:screen;opacity:0;transition:opacity .5s;animation:wp 1.1s ease-in-out infinite}
@keyframes wp{50%{filter:brightness(1.6)}}
.sring{position:absolute;border-radius:50%;pointer-events:none;mix-blend-mode:screen;opacity:0;transition:opacity .4s;background:conic-gradient(from 0deg,transparent,rgba(120,200,255,.9),transparent 30%,transparent 50%,rgba(170,140,255,.9),transparent 80%);-webkit-mask:radial-gradient(circle,transparent 83%,#000 86%,#000 93%,transparent 97%);mask:radial-gradient(circle,transparent 83%,#000 86%,#000 93%,transparent 97%);animation:sr .9s linear infinite}
.sring.on{opacity:1}
@keyframes sr{to{transform:rotate(360deg)}}
.ptr{transform-origin:50% 25%}
.ptr.fl{animation:none}
@keyframes fk{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
.w.spinning .light,.w.spinning .scan,.w.spinning .sweep,.w.spinning .glow,.w.spinning .gz,.w.spinning .tagfx,.w.spinning .frame{display:none!important}.w.spinning .pt,.w.spinning .st,.w.spinning .mote{animation-play-state:paused}
.cnt{position:absolute;display:grid;place-items:center;background:#061e5a;color:#fff;font:800 clamp(14px,2.1vw,34px)/1 system-ui,sans-serif;border-radius:4px;pointer-events:none;box-shadow:0 0 6px 4px #061e5a}
.cta.busy{pointer-events:none;filter:saturate(.6) brightness(.8)}
.hs.win{box-shadow:0 0 0 1.5px #9fe0ff,0 0 2.4vw rgba(120,190,255,.9);background:rgba(120,190,255,.22);animation:wn .7s ease-in-out 5}
@keyframes wn{50%{background:rgba(180,230,255,.4)}}
/* Перф без смены вида: полосы снова едут вниз (9s, сдвиг 80px), но через
   transform — композитор, а не repaint background-position на главном потоке. */
.scan{top:-100px;bottom:-100px}
@keyframes sc{to{translate:0 80px}}
.reset{display:block;margin:10px auto 0;background:none;border:0;color:#7aa8ff;font:500 13px system-ui;cursor:pointer;text-decoration:underline}
</style></head>

const add=(e)=>{w.appendChild(e);return e};

const gTitle=glitchZone(50,70,500,200),gNote=glitchZone(1380,150,150,130),gAll=glitchZone(0,0,1536,1024);
setInterval(()=>!spinning&&pulse(gTitle),3600);setInterval(()=>!spinning&&pulse(gNote,500),4700);setInterval(()=>!spinning&&pulse(gAll,380),9500);
/* свечения */
function glow(cx,cy,r,c){const g=document.createElement("div");g.className="glow";g.style.cssText=pc(cx-r,cy-r,2*r,2*r)+`;background:radial-gradient(circle,${c},transparent 68%)`;add(g)}
glow(800,520,380,"rgba(60,110,255,.30)");glow(1150,170,190,"rgba(150,170,255,.25)");glow(800,520,90,"rgba(120,190,255,.55)");
/* блик по заголовку */
const tf=document.createElement("div");tf.className="tagfx";tf.style.cssText=pc(50,70,500,200)+";rotate:0deg;border-radius:0";add(tf);
/* звёзды, лепестки */
[[800,150],[455,520],[1145,520],[800,870],[1495,45],[1490,285],[60,70],[270,70],[1330,400]].forEach(([x,y],i)=>{const s=document.createElement("i");s.className="st";s.style.cssText=`left:${x/W0*100}%;top:${y/H0*100}%;animation-delay:${i*.5}s;animation-duration:${2.4+i*.28}s`;add(s)});
for(let i=0;i<14;i++){const p=document.createElement("i");p.className="pt";p.style.cssText=`--sx:${(Math.random()-.5)*120}px;left:${i*7.2+Math.random()*3}%;--t:${8+Math.random()*7}s;--d:${-Math.random()*14}s;transform:scale(${.6+Math.random()*.8})`;add(p)}
const setHH=()=>w.style.setProperty("--hh",(w.clientHeight*1.1)+"px");setHH();addEventListener("resize",setHH);
/* ===== колесо ===== */
const CX=800,CY=520,R=345,N=11,STEP=360/N;
const PRIZES=[
 {n:"Большой сундук",row:2,ic:[750,215,125,100]},
 {n:"Мешок с деньгами",row:0,ic:[890,265,130,100]},
 {n:"Лот",row:1,ic:[975,395,110,84]},
 {n:"Лот",row:1,ic:[985,520,110,84]},
 {n:"Рамка крыльев демона",row:4,ic:[900,620,160,100]},
 {n:"Книги опыта",row:5,ic:[815,692,100,80]},
 {n:"Книги опыта",row:5,ic:[665,692,110,76]},
 {n:"Маленький сундук",row:3,ic:[565,615,110,95]},
 {n:"Билеты на гачу x5",row:6,ic:[505,500,110,76]},
 {n:"Пусто",row:-1,ic:[515,370,110,100]},
 {n:"Мешок с деньгами",row:0,ic:[600,250,125,100]}];
const discw=region(CX-R,CY-R,2*R,2*R,"clip-path:circle(48.7%);background:none");add(discw);
const disc=document.createElement("div");disc.className="disc";disc.style.cssText="position:absolute;inset:0;"+bgOf(CX-R,CY-R,2*R,2*R)+";background-repeat:no-repeat;transition:transform 6s cubic-bezier(.2,.6,.15,1);will-change:transform;transform:translateZ(0)";discw.appendChild(disc);
const wedge=document.createElement("div");wedge.className="wedge";disc.appendChild(wedge);
const ring=document.createElement("div");ring.className="sring";ring.style.cssText=pc(CX-R-25,CY-R-25,2*R+50,2*R+50);add(ring);
const hub=region(CX-88,CY-88,176,176,"clip-path:circle(50%)");add(hub);
const ptr=region(775,84,98,135,"clip-path:polygon(52% 0,64% 28%,98% 52%,60% 66%,50% 100%,40% 66%,2% 50%,38% 28%)");ptr.classList.add("ptr");add(ptr);
/* счётчик бесплатных круток */
const cnt=document.createElement("div");cnt.className="cnt";cnt.style.cssText=pc(340,374,30,34);cnt.textContent="0";add(cnt);
/* строки «Главных призов» */
const rows=[520,566,611,661,711,760,809].map(cy=>{const h=document.createElement("div");h.className="hs";h.style.cssText=pc(50,cy-22,345,44);return add(h)});
/* кнопка */
const cta=document.createElement("a");cta.className="cta idle";cta.href="#spin";cta.setAttribute("role","button");cta.setAttribute("aria-label","Крутить колесо");
cta.style.cssText=pc(1140,800,376,152)+";border-radius:6%/20%;z-index:4";
cta.append(fillR(region(1140,800,376,152)),Object.assign(document.createElement("div"),{className:"ring"}),Object.assign(document.createElement("div"),{className:"shine"}));
const gBtn=glitchZone(1140,800,376,152);gBtn.style.zIndex=5;add(cta);
cta.addEventListener("pointerenter",()=>gBtn.classList.add("loop"));cta.addEventListener("pointerleave",()=>gBtn.classList.remove("loop"));
w.addEventListener("pointermove",e=>{const r=w.getBoundingClientRect();w.style.setProperty("--mx",(e.clientX-r.left)/r.width*100+"%");w.style.setProperty("--my",(e.clientY-r.top)/r.height*100+"%")});
/* логика вращения */
const MAX_FREE=3;let used=0,rot=0,spinning=false;
const modal=document.getElementById("modal"),mi=document.getElementById("micon"),mt=document.getElementById("mt"),mp=document.getElementById("mp");
function burst(){const r=w.getBoundingClientRect(),cx=r.left+CX/W0*r.width,cy=r.top+CY/H0*r.height;
  for(let i=0;i<34;i++){const p=document.createElement("i");p.className="spark";p.style.left=cx+"px";p.style.top=cy+"px";const a=Math.PI*2*i/34,L=120+Math.random()*(r.width*.16);p.style.setProperty("--x",Math.cos(a)*L+"px");p.style.setProperty("--y",Math.sin(a)*L+"px");document.body.appendChild(p);setTimeout(()=>p.remove(),900)}}
function showPrize(p){
  const [x,y,iw,ih]=p.ic,k=150/iw;mi.style.cssText=`width:150px;height:${ih*k}px;margin:0 auto 12px;background:url("${src}") no-repeat;background-size:${W0*k}px ${H0*k}px;background-position:${-x*k}px ${-y*k}px;border-radius:12px`;
  mt.textContent=p.row<0?"Не повезло":"Ты выиграл!";mp.textContent=p.row<0?"Сектор «Пусто». Попробуй ещё раз.":p.n;modal.classList.add("on");document.getElementById("close").focus()}
function spin(){
  if(spinning)return;
  if(used>=MAX_FREE){mi.style.cssText="display:none";mt.textContent="Бесплатные крутки закончились";mp.textContent="Загляни позже или нажми «Сбросить демо» под виджетом.";modal.classList.add("on");return}
  spinning=true;cta.classList.add("busy");wedge.style.opacity=0;rows.forEach(r=>r.classList.remove("win"));
  const i=Math.floor(Math.random()*N),jit=(Math.random()-.5)*STEP*.6,a=i*STEP+jit;
  const cur=((rot%360)+360)%360,need=((-a-cur)%360+360)%360;rot+=360*6+need;
  disc.style.transform=`rotate(${rot}deg)`;ring.classList.add("on");ptr.classList.add("fl");w.classList.add("spinning");
  const start=performance.now();
  setTimeout(()=>ptr.classList.remove("fl"),4800);
  setTimeout(()=>{ // остановка
    spinning=false;cta.classList.remove("busy");ring.classList.remove("on");w.classList.remove("spinning");
    used++;cnt.textContent=used;
    
    const p=PRIZES[i];if(p.row>=0)rows[p.row].classList.add("win");
    burst();pulse(gAll,450);pulse(gTitle);setTimeout(()=>showPrize(p),650)},6150);
}
cta.addEventListener("click",e=>{e.preventDefault();
  const r=cta.getBoundingClientRect(),d=Math.max(r.width,r.height),s=document.createElement("i");
  s.className="rip";s.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;cta.querySelector(".shine").appendChild(s);setTimeout(()=>s.remove(),600);
  if(PRIZE_URL&&used>=MAX_FREE){window.open(PRIZE_URL,"_blank","noopener");return}
  spin()});
const shut=()=>modal.classList.remove("on");
document.getElementById("close").onclick=shut;modal.addEventListener("click",e=>{if(e.target===modal)shut()});addEventListener("keydown",e=>{if(e.key==="Escape")shut()});
document.getElementById("reset").onclick=()=>{used=0;cnt.textContent="0";wedge.style.opacity=0;rows.forEach(r=>r.classList.remove("win"))};
</script></body></html>
