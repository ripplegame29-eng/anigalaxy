<!doctype html><html><head><meta charset="utf-8"><style>
body{background:#0b0b13;margin:0;padding:16px;font:12px monospace;color:#9ca3af}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
.cell{text-align:center}
.box{width:150px;height:150px;margin:0 auto 6px;position:relative;background:radial-gradient(circle,#243050 0%,#141828 70%)}
.av{position:absolute;inset:22%;border-radius:50%;background:linear-gradient(135deg,#1f7bff,#00c8ff)}
img{position:absolute;inset:0;width:100%;height:100%}
</style></head><body><div class="grid" id="g"></div><script>
const g = document.getElementById('g');
for (let i = 1; i <= 39; i++) {
  const n = String(i).padStart(2, '0');
  g.insertAdjacentHTML('beforeend', `<div class="cell"><div class="box"><div class="av"></div><img src="frames/frame-${n}.svg"></div>frame-${n}</div>`);
}
</script></body></html>
