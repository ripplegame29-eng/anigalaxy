<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Шапка — AniGalaxy</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Unbounded:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;color-scheme:dark;--bg:#050810;--text:#eef2fb;--muted:#8d98b4;--line:rgba(96,150,255,.16);--blue:#2b7fff;--cyan:#22d3ee;--gold:#f5b74a;--green:#34e0a1;--red:#ff5d73;--violet:#9b86ff;--disp:"Unbounded","Manrope",sans-serif}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Manrope,system-ui,sans-serif;overflow-x:hidden}
a{color:inherit;text-decoration:none}button,input{font:inherit;color:inherit}button{cursor:pointer}svg{display:block}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.sky{position:fixed;inset:0;z-index:-2;background:radial-gradient(1000px 600px at 78% 0,rgba(43,127,255,.2),transparent 65%),radial-gradient(800px 600px at 0 55%,rgba(124,92,255,.1),transparent 60%),var(--bg)}
/* ===== ШАПКА ===== */
@property --a{syntax:'<angle>';initial-value:0deg;inherits:false}@keyframes spin{to{--a:360deg}}
.hd{position:sticky;top:0;z-index:100;padding:12px 14px 0;pointer-events:none}
.hi{pointer-events:auto;position:relative;max-width:1340px;margin:0 auto;height:66px;padding:0 10px 0 14px;display:flex;align-items:center;gap:12px;border-radius:26px;background:linear-gradient(180deg,rgba(14,22,44,.66),rgba(7,11,24,.7));backdrop-filter:blur(22px) saturate(1.5);box-shadow:0 18px 50px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.07);transition:max-width .45s cubic-bezier(.3,.9,.3,1),height .3s,background .3s}
.hi::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:conic-gradient(from var(--a),rgba(96,150,255,.18) 0 62%,var(--cyan) 80%,var(--blue) 90%,rgba(96,150,255,.18) 100%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 7s linear infinite;pointer-events:none}
.hi::after{content:"";position:absolute;left:30px;bottom:-1px;height:2px;border-radius:2px;width:calc((100% - 60px)*var(--pp,0));background:linear-gradient(90deg,var(--blue),var(--cyan),var(--violet));box-shadow:0 0 12px var(--blue);pointer-events:none}
.hd.sc .hi{max-width:1100px;height:58px;background:rgba(5,8,16,.9)}
.logo{display:flex;align-items:center;gap:6px;font:800 24px/1 Manrope,system-ui,sans-serif;letter-spacing:-.035em;flex:none}
.logo .fox{position:relative;width:58px;height:50px;flex:none;display:grid;place-items:center;margin:-6px 0 -6px -2px}
.logo .fox img{width:56px;height:56px;object-fit:contain;filter:drop-shadow(0 0 6px rgba(43,127,255,.5));transition:transform .45s cubic-bezier(.3,1.6,.5,1)}
.logo:hover .fox img{transform:rotate(-8deg) scale(1.12)}
.logo .fox s{position:absolute;width:7px;height:7px;background:#9fe8ff;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);opacity:0;pointer-events:none}
.logo .fox s:nth-of-type(1){top:-1px;right:-1px}.logo .fox s:nth-of-type(2){bottom:2px;left:-4px;width:5px;height:5px}
.logo:hover .fox s{animation:foxStar 1.1s ease-out infinite}.logo:hover .fox s:nth-of-type(2){animation-delay:.45s}
.logo b{font-weight:800;color:#fff}
.logo b em{font-style:normal;background:linear-gradient(100deg,#2b8cff,#1fb6ff 60%,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px rgba(43,127,255,.45))}
@keyframes foxStar{0%{opacity:0;transform:scale(.2) rotate(0)}40%{opacity:1}100%{opacity:0;transform:scale(1.3) rotate(90deg) translateY(-4px)}}
@media(prefers-reduced-motion:reduce){.logo:hover .fox s{animation:none}}
.nav{position:relative;display:flex;gap:2px}
.nav .hl,.nav .act{position:absolute;left:0;top:0;width:0;height:0;border-radius:12px;opacity:0;pointer-events:none}
.nav .hl{background:rgba(255,255,255,.07)}.nav .act{background:linear-gradient(135deg,rgba(43,127,255,.4),rgba(34,211,238,.15));box-shadow:inset 0 0 0 1px rgba(43,127,255,.6),0 0 20px rgba(43,127,255,.25)}
.nav.rdy .hl,.nav.rdy .act{transition:transform .32s cubic-bezier(.3,.9,.3,1.1),width .32s,height .32s,opacity .2s}
.nav a,.nav button{position:relative;z-index:1;display:flex;align-items:center;gap:6px;border:0;background:none;padding:8px 12px;border-radius:12px;font-weight:700;font-size:14px;color:#aab4cc;transition:color .2s}
.nav a:hover,.nav button:hover,.nav .on,.nav [aria-expanded=true]{color:#fff}.nav svg.ch{width:14px;transition:transform .25s}.nav [aria-expanded=true] svg.ch{transform:rotate(180deg)}
.sp{flex:1}
.srch{display:flex;align-items:center;gap:10px;height:42px;min-width:0;flex:1;max-width:340px;padding:0 12px;border-radius:14px;border:1px solid var(--line);background:rgba(3,6,14,.55);color:var(--muted);transition:.2s;text-align:left}
.srch:hover{border-color:rgba(43,127,255,.6);box-shadow:0 0 0 3px rgba(43,127,255,.14)}.srch svg{width:17px;flex:none}.srch span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
kbd{font:700 11px Manrope;padding:3px 7px;border-radius:7px;background:rgba(255,255,255,.07);border:1px solid var(--line);color:#aab4cc}
.ib{position:relative;width:42px;height:42px;flex:none;border-radius:13px;border:1px solid var(--line);background:rgba(255,255,255,.04);display:grid;place-items:center;color:#c3cadb;transition:.2s}
.ib:hover,.ib[aria-expanded=true]{background:rgba(43,127,255,.16);border-color:rgba(43,127,255,.6);color:#fff;transform:translateY(-2px)}.ib svg{width:19px}
.ib .bd{position:absolute;right:-5px;top:-5px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:linear-gradient(135deg,var(--blue),var(--cyan));font-size:10.5px;font-weight:800;display:grid;place-items:center;box-shadow:0 0 10px var(--blue);border:2px solid var(--bg)}
.ib .dot{position:absolute;right:7px;top:7px;width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold);animation:pl 1.8s infinite}@keyframes pl{50%{transform:scale(1.4);opacity:.6}}
.coin{display:flex;align-items:center;gap:8px;height:42px;padding:0 14px 0 8px;border-radius:13px;border:1px solid rgba(245,183,74,.35);background:rgba(245,183,74,.08);font-weight:800;transition:.2s}.coin:hover{background:rgba(245,183,74,.16);transform:translateY(-2px)}
.coin i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--gold),#ff8a3d);color:#2a1700;font-size:12px;font-style:normal;box-shadow:0 0 12px rgba(245,183,74,.6)}
.prem{position:relative;overflow:hidden;display:flex;align-items:center;gap:8px;height:42px;padding:0 16px;border-radius:13px;border:1px solid rgba(43,127,255,.6);background:linear-gradient(135deg,rgba(43,127,255,.25),rgba(34,211,238,.1));font-weight:800;letter-spacing:.04em;transition:.2s;flex:none}
.prem:hover{box-shadow:0 0 26px rgba(43,127,255,.5);transform:translateY(-2px)}.prem svg{width:17px;color:var(--gold)}
.prem::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.28) 50%,transparent 65%);transform:translateX(-120%);animation:sh 3.4s ease-in-out infinite}@keyframes sh{50%,100%{transform:translateX(120%)}}
.me{display:flex;align-items:center;gap:9px;height:46px;padding:0 10px 0 4px;border-radius:30px;border:1px solid var(--line);background:rgba(255,255,255,.04);transition:.2s;flex:none}.me:hover,.me[aria-expanded=true]{border-color:rgba(43,127,255,.6);background:rgba(43,127,255,.12)}
.av{position:relative;width:38px;height:38px;flex:none}.av svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}.av circle{fill:none;stroke-width:3}.av .t{stroke:rgba(255,255,255,.12)}.av .v{stroke:url(#xg);stroke-linecap:round;stroke-dasharray:113;stroke-dashoffset:113;transition:stroke-dashoffset 1.4s cubic-bezier(.2,.9,.2,1)}
.av b{position:absolute;inset:5px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:radial-gradient(circle at 30% 25%,#7cc0ff,#2b3b8f 70%);border:1px solid rgba(255,255,255,.2)}
.av em{position:absolute;right:-4px;bottom:-4px;min-width:17px;height:17px;border-radius:6px;background:var(--bg);border:1px solid var(--gold);color:var(--gold);font:800 9.5px var(--disp);display:grid;place-items:center;font-style:normal}
.me span{font-weight:800;font-size:13.5px;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.me svg.ch{width:14px;color:var(--muted);transition:.25s}.me[aria-expanded=true] svg.ch{transform:rotate(180deg)}
.bur{display:none}
/* ===== минимализм: капсула, поиск, профиль ===== */
.cap{display:flex;align-items:center;gap:2px;padding:4px;border-radius:17px;background:rgba(255,255,255,.04);border:1px solid var(--line);flex:none}
.cap .ib{width:38px;height:38px;border:0;background:none;border-radius:13px}
.cap .ib:hover,.cap .ib[aria-expanded=true]{background:rgba(43,127,255,.2);transform:none}
.cap .ib .bd{border-color:#0b1226}
.srch{container-type:inline-size;max-width:none;flex:0 1 260px;min-width:46px;width:auto;padding:0;height:46px;border-radius:16px;border-color:transparent;background:rgba(255,255,255,.04)}
.si{display:flex;align-items:center;gap:10px;width:100%;padding:0 12px;min-width:0}.si svg{flex:none}
@container (max-width:170px){.si{justify-content:center;padding:0}.si span,.si kbd{display:none}}
.hi>*{min-width:0}.hi>.logo,.hi>.cap,.hi>.prem,.hi>.rel,.hi>.nav{flex:none}.hi{overflow:visible}.sp{flex:1 1 0;min-width:0}
.prem{height:46px;border-radius:16px}
.me{height:46px;gap:10px;padding:0 12px 0 4px;border-radius:16px}
.me span{font-weight:inherit;font-size:inherit;max-width:none;overflow:visible;text-overflow:clip;white-space:normal}
.nm{display:flex;flex-direction:column;line-height:1.2;text-align:left}.nm b{font-size:13.5px;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.nm small{font-size:11.5px;font-weight:800;color:var(--gold)}
.cap .ib[data-tip]::after{content:attr(data-tip);position:absolute;top:calc(100% + 12px);left:50%;transform:translate(-50%,-4px);white-space:nowrap;padding:6px 11px;border-radius:10px;background:#0d1730;border:1px solid rgba(43,127,255,.5);font-size:12px;font-weight:800;color:#fff;opacity:0;pointer-events:none;transition:.2s;box-shadow:0 10px 30px rgba(0,0,0,.6);z-index:6}
.cap .ib[data-tip]:hover::after{opacity:1;transform:translate(-50%,0);transition-delay:.25s}.cap .ib[aria-expanded=true]::after{display:none}

/* ===== СТИЛЬ КАК НА СКРИНЕ: плоская тёмная панель ===== */
.hd{padding:0;pointer-events:auto;background:rgba(6,8,15,.94);border-bottom:1px solid rgba(255,255,255,.06);backdrop-filter:blur(14px)}
.hi,.hd.sc .hi{max-width:1560px;height:64px;padding:0 16px;gap:12px;border-radius:0;background:none;box-shadow:none;backdrop-filter:none}
.hi::before,.hi::after{display:none}
.nav{gap:4px;margin-left:4px}
.nav a,.nav button{padding:9px 13px;border-radius:10px;font-size:15px;font-weight:700;color:#9ca5bb}
.nav a:hover,.nav button:hover{color:#fff}
.nav svg.ch{display:none}
.nav .hl{background:rgba(255,255,255,.05);border-radius:10px}
.nav .act{background:rgba(255,255,255,.09);box-shadow:none;border-radius:10px}
.srch{flex:1 1 320px;max-width:440px;min-width:46px;height:40px;border-radius:10px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03)}
.srch:hover{border-color:rgba(255,255,255,.18);box-shadow:none}
.si{padding:0 14px;font-size:14px}.si kbd{display:none}
.cap{padding:0;gap:6px;background:none;border:0;border-radius:0}
.cap .ib{width:40px;height:40px;border:1px solid rgba(255,255,255,.08);border-radius:10px;background:rgba(255,255,255,.03);color:#cfd6e6}
.cap .ib:hover,.cap .ib[aria-expanded=true]{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.18);transform:none}
.cap .ib .bd{border-color:#06080f}
.prem{height:40px;border-radius:10px;padding:0 18px;letter-spacing:0;font-weight:800;border:1px solid rgba(43,127,255,.55);background:linear-gradient(180deg,rgba(43,127,255,.14),rgba(43,127,255,.04))}
.prem::after{display:none}
.prem:hover{box-shadow:0 0 18px rgba(43,127,255,.3);transform:none}
.me{height:42px;border-radius:12px;padding:0 10px 0 5px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03)}
.me:hover,.me[aria-expanded=true]{border-color:rgba(255,255,255,.18);background:rgba(255,255,255,.07)}
.av{width:34px;height:34px}.av b{inset:4px;font-size:13px}.av em{background:#1d7bff;border:0;color:#fff;border-radius:50%;min-width:16px;height:16px;right:-5px;bottom:-3px;font:800 9.5px Manrope}
.nm small{display:none}.nm b{font-size:14px;max-width:130px}
.dd{top:calc(100% + 8px)}
/* ===== ДРОПДАУНЫ ===== */
.dd{position:absolute;top:calc(100% + 10px);z-index:5;border-radius:22px;border:1px solid rgba(255,255,255,.1);background:linear-gradient(#0d1426f5,#080c18f8);backdrop-filter:blur(22px);box-shadow:0 30px 80px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.06),0 0 60px rgba(43,127,255,.1);
 opacity:0;visibility:hidden;transform:translateY(-10px) scale(.96);filter:blur(6px);transition:opacity .22s,transform .32s cubic-bezier(.2,.9,.25,1.15),filter .25s,visibility 0s .3s}
.dd.o{opacity:1;visibility:visible;transform:none;filter:none;transition-delay:0s}
.dd .it{opacity:0;transform:translateX(10px);transition:.3s}.dd.o .it{opacity:1;transform:none;transition-delay:calc(var(--i)*35ms + 80ms)}
.rel{position:relative}
.mega{left:0;width:620px;padding:12px;display:grid;grid-template-columns:1fr 210px;gap:12px}
.mi{display:flex;gap:13px;align-items:center;padding:10px;border-radius:14px;transition:.2s}.mi:hover{background:rgba(255,255,255,.06);transform:translateX(4px)}
.mi .ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 15%,transparent);border:1px solid color-mix(in srgb,var(--c) 40%,transparent);color:var(--c);flex:none;transition:.25s}.mi:hover .ic{transform:rotate(-8deg) scale(1.1);box-shadow:0 0 18px color-mix(in srgb,var(--c) 50%,transparent)}.mi .ic svg{width:20px}
.mi b{display:block;font-size:14px}.mi small{color:var(--muted);font-size:12px}
.feat{border-radius:16px;padding:16px;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden;min-height:230px;background:linear-gradient(160deg,rgba(43,127,255,.5),rgba(124,92,255,.35) 60%,rgba(5,8,16,.9));border:1px solid rgba(43,127,255,.5)}
.feat::before{content:"";position:absolute;width:160px;height:160px;right:-40px;top:-40px;border-radius:50%;background:radial-gradient(circle,rgba(34,211,238,.7),transparent 70%);animation:fl 5s ease-in-out infinite}@keyframes fl{50%{transform:translate(-14px,14px)}}
.feat small{letter-spacing:.14em;font-size:10px;font-weight:800;color:#bcd6ff;position:relative}.feat b{font:800 18px/1.2 var(--disp);margin:6px 0 12px;position:relative}.feat span{position:relative;align-self:flex-start;padding:7px 14px;border-radius:10px;background:#fff;color:#0a1430;font-weight:800;font-size:12.5px}
.pn{right:0;width:370px;max-width:calc(100vw - 20px);padding:16px}
.pn h5{margin:0 0 4px;font:800 13px Manrope;letter-spacing:.14em;color:var(--muted);display:flex;justify-content:space-between}.pn h5 a{color:var(--cyan);letter-spacing:0;font-size:12.5px}
.ntf{display:flex;gap:12px;padding:11px;border-radius:14px;margin-top:6px;transition:.2s;position:relative}.ntf:hover{background:rgba(255,255,255,.05)}.ntf.un::after{content:"";position:absolute;right:12px;top:14px;width:8px;height:8px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.ntf .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c);flex:none}.ntf .ic svg{width:18px}.ntf b{display:block;font-size:13.5px}.ntf small{color:var(--muted);font-size:12px}
.promo{border-radius:16px;padding:16px;background:linear-gradient(135deg,rgba(43,127,255,.3),rgba(155,134,255,.2));border:1px solid rgba(43,127,255,.5);position:relative;overflow:hidden}.promo small{font-size:10px;letter-spacing:.14em;font-weight:800;color:#bcd6ff}.promo b{display:block;font:800 22px var(--disp);margin-top:4px}.promo b em{font-style:normal;background:linear-gradient(100deg,#7cc0ff,var(--cyan),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.tk{display:flex;gap:12px;align-items:center;padding:11px;border-radius:14px;margin-top:8px;border:1px solid var(--line);background:rgba(255,255,255,.03)}.tk .rg{width:26px;height:26px;border-radius:50%;border:2px dashed rgba(255,255,255,.25);flex:none;display:grid;place-items:center}.tk.d .rg{border:0;background:linear-gradient(135deg,var(--green),#14b8a6)}.tk.d .rg svg{width:14px}.tk b{font-size:13.5px}.tk small{color:var(--muted);display:block;font-size:11.5px}.tk a{margin-left:auto;font-size:12px;font-weight:800;padding:6px 11px;border-radius:9px;background:rgba(43,127,255,.2);border:1px solid rgba(43,127,255,.5)}
.bar{height:8px;border-radius:8px;background:rgba(255,255,255,.08);margin-top:12px;overflow:hidden}.bar i{display:block;height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,var(--blue),var(--cyan));transition:width 1.2s .2s}.dd.o .bar i{width:var(--w)}
.um{right:0;width:320px;max-width:calc(100vw - 20px);padding:14px}
.uh{display:flex;gap:12px;align-items:center;padding:6px 6px 14px}.uh .av{width:54px;height:54px}.uh .av circle{stroke-width:3.4}.uh b{display:block;font-size:16px}.uh small{color:var(--muted)}
.lv{padding:12px;border-radius:14px;background:rgba(3,6,14,.55);border:1px solid var(--line);margin-bottom:8px}.lv div{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}.lv b{color:#fff}
.ul a{display:flex;align-items:center;gap:12px;padding:10px;border-radius:12px;font-weight:700;color:#cfd7ea;transition:.2s}.ul a:hover{background:rgba(255,255,255,.06);color:#fff;transform:translateX(4px)}.ul svg{width:18px;color:var(--cyan)}.ul i{margin-left:auto;font-style:normal;font-size:11px;padding:2px 8px;border-radius:8px;background:var(--blue);font-weight:800}
.ul hr{border:0;height:1px;background:var(--line);margin:6px 4px}.ul .ex{color:var(--red)}.ul .ex svg{color:var(--red)}
/* поиск-палитра */
.cp{position:fixed;inset:0;z-index:200;display:flex;justify-content:center;align-items:flex-start;padding:min(13vh,120px) 14px 0;background:rgba(2,4,10,.74);backdrop-filter:blur(12px) saturate(1.2);opacity:0;visibility:hidden;transition:opacity .2s,visibility 0s .2s}.cp.o{opacity:1;visibility:visible;transition-delay:0s}
.cpw{width:min(800px,100%);transform:translateY(-18px) scale(.97);transition:transform .38s cubic-bezier(.2,.9,.25,1.15)}.cp.o .cpw{transform:none}
.cpb{display:flex;align-items:center;gap:8px;height:64px;padding:0 10px 0 18px;border-radius:21px;border:1px solid rgba(43,127,255,.65);background:#0a1126;box-shadow:0 0 0 4px rgba(43,127,255,.12),0 30px 80px rgba(0,0,0,.7),0 0 70px rgba(43,127,255,.22)}
.cpb>svg{width:21px;color:var(--cyan);flex:none}.cpb input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:17px;padding:0 6px}
.cpb .fr{width:40px;height:40px;border-radius:12px;border:0;background:none;color:var(--muted);display:grid;place-items:center;flex:none;transition:.2s}.cpb .fr:hover{color:#fff;background:rgba(255,255,255,.07)}.cpb .fr svg{width:19px}
.cpb .esc{height:40px;padding:0 13px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-weight:800;font-size:12px;color:#aab4cc;flex:none}.cpb .esc:hover{color:#fff}
.modes{display:flex;gap:2px;padding:4px;border-radius:15px;background:rgba(255,255,255,.04);border:1px solid var(--line);position:relative;flex:none}

$('#sb').onclick=openCp;$('#cesc').onclick=closeCp;cp.onclick=e=>{if(e.target==cp)closeCp()};cq.oninput=()=>{sel=0;draw()};
$('#modes').onclick=e=>{const b=e.target.closest('button');if(b)setMode(+b.dataset.m)};
$('#crc').onclick=e=>{const b=e.target.closest('[data-r]');if(b){cq.value=b.dataset.r;sel=0;draw();cq.focus()}};
cr.onclick=e=>{const r=e.target.closest('.ri');r&&pick(+r.dataset.i)};cr.onpointermove=e=>{const r=e.target.closest('.ri');if(r&&+r.dataset.i!=sel){sel=+r.dataset.i;mark()}};
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()=='k'){e.preventDefault();cp.classList.contains('o')?closeCp():openCp()}
 if(e.key=='Escape'){closeCp();closeAll()}
 if(!cp.classList.contains('o'))return;
 if(e.key=='ArrowDown'&&rows.length){e.preventDefault();sel=(sel+1)%rows.length;mark()}
 if(e.key=='ArrowUp'&&rows.length){e.preventDefault();sel=(sel-1+rows.length)%rows.length;mark()}
 if(e.key=='Enter')pick(sel);
 if(e.key=='Tab'){e.preventDefault();setMode(mode+(e.shiftKey?-1:1))}});
</script>
</body>
</html>
