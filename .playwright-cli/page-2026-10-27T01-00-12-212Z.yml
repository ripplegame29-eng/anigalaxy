      - heading "AnimeGO — смотреть аниме онлайн бесплатно" [level=1] [ref=e502]
      - generic [ref=e503]:
        - paragraph [ref=e504]: Вот уже много лет японская анимация пользуется огромным успехом по всему миру, включая Россию. Эти ленты любят за яркий сюжет, оригинальную рисовку и неизменный накал эмоций.
        - paragraph [ref=e505]:
          - text: Многие поклонники любят
          - strong [ref=e506]: смотреть аниме онлайн
          - text: ", однако для этого часто приходится пользоваться несколькими источниками, поскольку ни один из них нельзя назвать универсальным. Но у нас есть отличная новость для любителей аниме! Мы запустили новый проект AnimeGO, посвящённый онлайн-просмотру аниме. Теперь Вам не придётся бороздить просторы интернета в поисках любимого тайтла – все лучшие аниме в хорошем качестве уже есть на нашем портале. Мы сами очень любим этот жанр и поэтому постарались сделать наш сайт как можно более удобным и захватывающим."
      - generic [ref=e507]: Наши преимущества
      - paragraph [ref=e508]: "Мы подготовили для Вас следующие бонусы:"
      - list [ref=e509]:
        - listitem [ref=e510]:
          - text: Огромный выбор
          - link "аниме онлайн" [ref=e511] [cursor=pointer]:
            - /url: https://animego.me/anime
          - text: . У нас загружены все популярные и качественные аниме прошлых лет, и наша коллекция регулярно пополняется самыми последними новинками. В каталоге есть как
          - link "полнометражные" [ref=e512] [cursor=pointer]:
            - /url: https://animego.me/anime/type/movie
          - text: ", так и"
          - link "аниме сериалы" [ref=e513] [cursor=pointer]:
            - /url: https://animego.me/anime/type/tv
          - text: ", а жанровое разнообразие во многом превосходит другие аналогичные порталы. У нас Вы сможете посмотреть красивые произведения о любви и дружбе, вере и предательстве, доброте и корысти, и многое другое."
        - listitem [ref=e514]: Превосходное качество. Все файлы предоставляются в HD-формате, что позволяет смотреть аниме онлайн в хорошем качестве не только на персональном компьютере, но и на телевизоре. Благодаря грамотному использованию IT-технологий мы гарантируем Вам комфортный бесперебойный просмотр любого аниме, максимально имитирующий поход в настоящий кинотеатр. При этом Вы сможете в любой момент поставить на паузу или перемотать его до нужного момента.
        - listitem [ref=e515]: Удобная навигация. Сайт AnimeGO – это не просто хранилище аниме онлайн, а структурированная фильмотека, в которой очень легко ориентироваться. Все файлы отсортированы по жанру, длительности, компании-создателю и другим параметрам. Вы всегда сможете в считанные минуты найти именно ту ленту, которую ищете.
        - listitem [ref=e516]: Минимум рекламы. Как и большинство других сайтов, мы пользуемся рекламой, но в то же время мы позаботились о том, чтобы рекламные объявления не мешали вашему просмотру. Ненавязчивая и дозированная реклама – это одно из преимуществ портала AnimeGO, которое уже оценили тысячи зрителей.
      - paragraph [ref=e517]: А ещё мы рады предложить Вам приятный дизайн сайта, быструю работу всех разделов и удобный доступ с различных устройств. Смотреть аниме онлайн теперь стало ещё приятнее и комфортнее!
      - heading "На AnimeGO – только бесплатные аниме без регистрации" [level=4] [ref=e518]
      - generic [ref=e519]:
        - paragraph [ref=e520]: Самый главный плюс нашего портала – это возможность смотреть все аниме абсолютно бесплатно. Мы считаем, что искусство японской мультипликации должно быть доступно каждому, тем более что большинство наших зрителей – представители молодёжи. Плата не взимается ни на каком этапе пользования сайтом, что делает наш проект по-настоящему удобным для каждого.
        - paragraph [ref=e521]:
